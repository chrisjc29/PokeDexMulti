[versions]
agp = "8.9.1"
kotlin = "2.3.0"
composeMultiplatform = "1.11.0"
androidx-activityCompose = "1.9.3"
androidx-core = "1.13.1"
coroutines = "1.9.0"
serialization = "1.7.3"
# NOT 0.6.1. A transitive dependency requires 0.7.x and Gradle takes the highest, so pinning lower
# doesn't downgrade anything - it just means the catalog disagrees with what the compiler sees.
# 0.7.0 widened LocalDate.toEpochDays()/fromEpochDays() from Int to Long, so code written against
# the Int signature stops compiling the moment the real version wins.
datetime = "0.7.1"
# Arrow supplies the domain layer's Either. 2.2.1.1 was the release that added Kotlin 2.3
# compatibility, so anything below it will not resolve against the kotlin pin above. Arrow is
# published for every Kotlin/Native target CMP builds, so this is safe in commonMain.
#
# NOT 2.2.3: its Kotlin/Native klibs are built by the 2.4.0 compiler and carry abi_version 2.4.0,
# which a 2.3.0 compiler refuses to read ("The current Kotlin compiler can consume libraries having
# ABI version <= 2.3.0"). Android compiles fine and only the iOS targets fail, so this shows up as a
# platform-specific break rather than a version conflict. 2.2.2.1 is the newest release whose native
# klibs are abi_version 2.3.0. Bump this only together with the kotlin pin.
arrow = "2.2.2.1"
koin = "4.2.2"
ktor = "3.5.0"
lifecycle = "2.9.0"
nav3 = "1.0.0-alpha05"
lifecycleViewmodelNav3 = "2.10.0-alpha05"
firebaseBom = "34.15.0"
googleServices = "4.5.0"
crashlyticsPlugin = "3.0.7"
roborazzi = "1.59.0"
kover = "0.9.1"
robolectric = "4.14.1"
composeUiTooling = "1.7.6"
junit = "4.13.2"
# MUST stay in lockstep with `roborazzi` above - these two are peers, not independent libraries.
# Roborazzi's AndroidComposePreviewTester calls the scanner's AndroidPreviewScreenshotIdBuilder
# directly, and the two moved ignoreClassName() between the android subclass and
# core.preview.screenshotid.PreviewScreenshotIdBuilder at different times. Mismatch them and EVERY
# generated preview test dies with the same NoSuchMethodError, naming a method nobody in this repo
# calls.
#
# Verified working pair on this project: roborazzi 1.59.0 + scanner 0.9.2. (roborazzi 1.46.1 +
# scanner 0.8.2 does NOT work despite being a plausible-looking pairing - 1.46.1 expects
# ignoreClassName() declared on the android subclass, and no published scanner declares it there.)
# Bump these two together, and re-run recordRoborazziDebug to confirm before trusting it.
composablePreviewScanner = "0.9.2"
# This app loads Pokemon artwork from the PokeAPI, so Coil is used rather than commented out.
coil = "3.2.0"
# compileSdk must be 36: Compose 1.11 transitively pulls androidx.activity 1.12.x, which requires
# compiling against API 36 and AGP >= 8.9.1. targetSdk/minSdk can stay lower — you only need to
# *compile* against 36, not change runtime behavior or min device support.
compileSdk = "36"
minSdk = "24"
targetSdk = "35"

[libraries]
# Coroutines / serialization
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# Arrow - typed errors in the domain layer
# Only arrow-core is needed. If you later add arrow-optics or arrow-fx-coroutines, switch to the
# BOM (io.arrow-kt:arrow-stack) and drop the per-module version refs, exactly as Koin does above.
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }

# Compose / Android
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }

# Previews. CMP 1.10 made the original AndroidX @Preview annotation multiplatform and deprecated
# JetBrains' own org.jetbrains.compose.ui.tooling.preview.Preview, so the annotation now comes from
# ui-tooling-preview and the renderer that draws them in the IDE from ui-tooling. Ship both: the
# annotation alone marks a composable as previewable but leaves the preview pane blank.
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }

# Koin (BOM-managed)
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-compose-navigation3 = { module = "io.insert-koin:koin-compose-navigation3" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-test = { module = "io.insert-koin:koin-test" }

# Lifecycle ViewModel (multiplatform) for the MVI presentation layer
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Navigation 3 (multiplatform). navigation3-common is pulled transitively by -ui.
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "nav3" }
lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Coil 3 - multiplatform image loading. The ktor3 integration reuses the app's HttpClient.
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# Firebase (Android, BOM-managed)
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

# Regression screenshot testing (Android/JVM via Robolectric)
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-preview-scanner = { module = "io.github.takahirom.roborazzi:roborazzi-compose-preview-scanner-support", version.ref = "roborazzi" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "composeUiTooling" }
androidx-compose-ui-test-junit4-android = { module = "androidx.compose.ui:ui-test-junit4-android", version.ref = "composeUiTooling" }
# Adds the bare ComponentActivity to the DEBUG manifest. Compose's v2 runComposeUiTest launches one
# through ActivityScenario, and without this the merged manifest has no such activity: every UI test
# fails with "Unable to resolve activity for Intent ... androidx.activity.ComponentActivity".
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeUiTooling" }
# Runtime peers that Roborazzi's generateComposePreviewRobolectricTests needs on the test classpath
# but does NOT pull transitively — without both, the generated screenshot tests fail to compile/run.
junit = { module = "junit:junit", version.ref = "junit" }
composable-preview-scanner = { module = "io.github.sergio-sastre.ComposablePreviewScanner:android", version.ref = "composablePreviewScanner" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" }
crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
