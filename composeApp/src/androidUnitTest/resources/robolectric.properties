# Robolectric instantiates the manifest's android:name Application for every test, and that is
# MainApplication - whose onCreate() calls startKoin. Koin's container is static and global, so the
# second test in the JVM dies with KoinApplicationAlreadyStartedException.
#
# The hand-written tests each carry @Config(application = TestApplication::class) and so avoid it.
# The Roborazzi screenshot tests cannot: their class is generated by the plugin at build time, its
# @Config sets only sdk and qualifiers, and there is nowhere to add the annotation. Declaring it here
# covers them, because Robolectric merges this file as defaults under any @Config - the generated
# annotation does not mention `application`, so this value wins for it, while the hand-written
# classes keep overriding it with the same class anyway.
#
# Without this line, recordRoborazziDebug fails on the second preview every time it is run, and no
# goldens are ever produced.
application=com.unomaster.pokedexgame.TestApplication

# Pinned so every Robolectric test resolves the same SDK jar rather than following compileSdk, which
# would silently change behaviour on an SDK bump. Match the @Config(sdk = [34]) on each test class.
sdk=34

# Compose draws through Skia, so Robolectric's native graphics mode is required for anything that
# measures or renders - the legacy mode produces empty canvases and every assertion on drawn output
# fails for reasons that look nothing like the actual cause.
robolectric.graphicsMode=NATIVE

# Robolectric's default display is 320x470dp - smaller than any phone the app targets. Tall content
# sits below the fold, so assertIsDisplayed/performClick fail on things that are obviously there, and
# wide rows clip.
qualifiers=w480dp-h1600dp
