name: Record goldens (temporary)

# Temporary helper: re-records the Roborazzi goldens on a runner and commits them back to this
# branch. Removed once the goldens have landed.
on:
  push:
    branches:
      - claude/app-rename-whos-that-5i17tn

permissions:
  contents: write

concurrency:
  group: record-goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Ruby (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Re-record the Roborazzi goldens
        run: bundle exec fastlane android screenshots

      # Backup path: if the commit step cannot push, the recorded images are still retrievable.
      - name: Upload recorded goldens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recorded-goldens
          path: composeApp/src/androidUnitTest/screenshots
          retention-days: 7
          if-no-files-found: warn

      # A GITHUB_TOKEN push does not re-trigger this workflow, so this cannot loop.
      - name: Commit the re-recorded goldens
        run: |
          if git diff --quiet -- composeApp/src/androidUnitTest/screenshots; then
            echo "Goldens unchanged - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composeApp/src/androidUnitTest/screenshots
          git commit -m "Re-record Roborazzi goldens for the \"Who's That\" rename"
          git push origin HEAD:${{ github.ref_name }}
