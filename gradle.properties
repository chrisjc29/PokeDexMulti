#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#Firebase — opt-in. Left false so the project builds and runs with NO Firebase config files.
#Set to true (and drop in google-services.json / GoogleService-Info.plist) to enable Analytics + Crashlytics.
firebase.enabled=false
